<!DOCTYPE html>
<html lang="fa" dir="rtl" data-mode="dark" data-style="glass" data-accent="indigo" data-anim="on">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; script-src 'self'" />
  <title>Raad — Downloads</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/views.css" />
  <style>
    html, body { background: transparent; }
    body { padding: 0; overflow: hidden; }
    .dlg-root { height: 100vh; display: flex; flex-direction: column; border-radius: 14px; }
    #titlebar { border-radius: 14px 14px 0 0; flex: 0 0 auto; }
    .dlg-foot { border-radius: 0 0 14px 14px; flex: 0 0 auto; }
    .pr-list { flex: 1 1 auto; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    .pr-row { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 10px;
              background: color-mix(in srgb, currentColor 6%, transparent); border: 1px solid color-mix(in srgb, currentColor 10%, transparent); }
    .pr-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .pr-ic { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center;
             font-size: 9px; font-weight: 700; letter-spacing: .3px; background: color-mix(in srgb, currentColor 12%, transparent); }
    .pr-name { flex: 1 1 auto; min-width: 0; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: ltr; text-align: left; }
    .pr-pct { flex: 0 0 auto; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .pr-bar { height: 6px; border-radius: 3px; background: color-mix(in srgb, currentColor 12%, transparent); overflow: hidden; }
    .pr-fill { height: 100%; width: 0%; border-radius: 3px; background: var(--acc, #6366f1); transition: width .25s linear; }
    .pr-row.done .pr-fill { background: #10b981; }
    .pr-row.err  .pr-fill { background: #ef4444; }
    .pr-meta { display: flex; align-items: center; gap: 10px; font-size: 10.5px; opacity: .75; font-variant-numeric: tabular-nums; }
    .pr-meta .grow { flex: 1 1 auto; }
    .pr-acts { display: flex; gap: 4px; }
    .pr-btn { border: 0; cursor: pointer; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center;
              background: color-mix(in srgb, currentColor 10%, transparent); color: inherit; }
    .pr-btn:hover { background: color-mix(in srgb, currentColor 18%, transparent); }
    .pr-btn.danger:hover { background: color-mix(in srgb, #ef4444 25%, transparent); }
    .pr-empty { text-align: center; opacity: .55; font-size: 12px; padding: 18px 0 10px; }
  </style>
</head>
<body>
  <div class="dlg-root">
    <header id="titlebar">
      <div class="tb-brand">
        <span class="logo"><svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M13 2 4.5 13.5h5.2L8.6 22l8.9-11.5h-5.3L13 2z"/></svg></span>
        <span class="tb-title" data-i="progTitle">پیشرفت دانلود</span>
      </div>
      <div class="tb-drag"></div>
      <div class="tb-actions">
        <button class="tb-btn" id="prMin"><svg viewBox="0 0 24 24" width="14" height="14"><path stroke="currentColor" stroke-width="2" d="M5 12h14"/></svg></button>
        <button class="tb-btn tb-close" id="prClose"><svg viewBox="0 0 24 24" width="14" height="14"><path stroke="currentColor" stroke-width="2" d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
    </header>

    <div class="pr-list" id="prList">
      <div class="pr-empty" id="prEmpty" data-i="progEmpty">دانلود فعالی نیست…</div>
    </div>

    <div class="dlg-foot">
      <button class="btn" id="prPauseAll" data-i="btnPauseAll">توقف همه</button>
      <span style="flex:1"></span>
      <button class="btn primary" id="prOpenApp" data-i="progOpenApp">پنجره اصلی</button>
    </div>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="progress.js"></script>
</body>
</html>
