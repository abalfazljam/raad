<!DOCTYPE html>
<html lang="fa" dir="rtl" data-mode="dark" data-style="glass" data-accent="indigo" data-anim="on">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; script-src 'self'" />
  <title>Raad — Complete</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/views.css" />
  <style>
    html, body { background: transparent; }
    body { padding: 0; overflow: hidden; }
    .dlg-root { height: 100vh; display: flex; flex-direction: column; border-radius: 14px; }
    #titlebar { border-radius: 14px 14px 0 0; flex: 0 0 auto; }
    .dlg-body { flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; overflow: hidden; }
    .dlg-foot { border-radius: 0 0 14px 14px; flex: 0 0 auto; }
    .cp-head { display: flex; align-items: center; gap: 10px; }
    .cp-check { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
                background: color-mix(in srgb, #10b981 18%, transparent); color: #10b981; }
    .cp-name { flex: 1 1 auto; min-width: 0; font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: ltr; text-align: left; }
    .cp-sub { font-size: 11px; opacity: .7; direction: ltr; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cp-drag { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px;
               border: 1.5px dashed color-mix(in srgb, currentColor 28%, transparent); cursor: grab; user-select: none;
               background: color-mix(in srgb, currentColor 4%, transparent); }
    .cp-drag:active { cursor: grabbing; }
    .cp-drag .ic { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
                   background: color-mix(in srgb, currentColor 10%, transparent); font-size: 9px; font-weight: 700; }
    .cp-drag .tx { font-size: 11.5px; opacity: .8; line-height: 1.6; }
    .cp-path { font-size: 10.5px; opacity: .65; direction: ltr; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <div class="dlg-root">
    <header id="titlebar">
      <div class="tb-brand">
        <span class="logo"><svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M13 2 4.5 13.5h5.2L8.6 22l8.9-11.5h-5.3L13 2z"/></svg></span>
        <span class="tb-title" data-i="compDone">دانلود کامل شد</span>
      </div>
      <div class="tb-drag"></div>
      <div class="tb-actions">
        <button class="tb-btn tb-close" id="cpClose"><svg viewBox="0 0 24 24" width="14" height="14"><path stroke="currentColor" stroke-width="2" d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
    </header>

    <div class="dlg-body">
      <div class="cp-head">
        <div class="cp-check"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></div>
        <div style="min-width:0; flex:1">
          <div class="cp-name" id="cpName">…</div>
          <div class="cp-sub" id="cpSub"></div>
        </div>
      </div>

      <div class="cp-drag" id="cpDrag" title="">
        <div class="ic" id="cpExt">FILE</div>
        <div class="tx" data-i="compDrag">فایل را از اینجا بکشید و در هر پوشه‌ای رها کنید</div>
      </div>

      <div class="cp-path" id="cpPath"></div>
    </div>

    <div class="dlg-foot">
      <button class="btn" id="cpFolder" data-i="compFolder">نمایش در پوشه</button>
      <button class="btn" id="cpCopy" data-i="compCopy">کپی فایل</button>
      <button class="btn primary" id="cpOpen" data-i="compOpen">اجرای فایل</button>
    </div>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="complete.js"></script>
</body>
</html>
